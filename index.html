<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CubeWar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f0f16; color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 8px; overflow: hidden; touch-action: none;
    user-select: none;
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: 6px; color: #fff; margin: 8px 0 4px; text-shadow: 0 0 20px rgba(155,184,255,0.5); }
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
  .screen.active { display: flex; }
  input { background: #1c1c26; border: 1px solid #2e2e3c; color: #fff; padding: 14px 16px; border-radius: 10px; font-size: 15px; width: 100%; margin: 6px 0; outline: none; font-family: inherit; text-align: center; transition: 0.15s; }
  input:focus { border-color: #5a7fd8; background: #202030; }
  .big-btn { background: linear-gradient(180deg, #4a6fd8, #3a5fcd); border: none; color: #fff; padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin: 5px 0; transition: 0.15s; font-family: inherit; letter-spacing: 1px; text-transform: uppercase; }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:disabled { background: #1c1c26; color: #555; cursor: default; text-transform: none; letter-spacing: 0; }
  .big-btn.green { background: linear-gradient(180deg, #2ecc71, #27ae60); }
  .hint { font-size: 12px; color: #666680; text-align: center; margin: 6px 0; line-height: 1.5; }
  .status { font-size: 12px; color: #666680; margin: 4px 0; text-align: center; }
  #gameCanvasWrap { width: 100%; max-width: 600px; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); background: #fff; }
  #gameCanvasWrap canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .controls { display: grid; grid-template-columns: repeat(5, 58px); grid-template-rows: repeat(2, 58px); gap: 8px; margin-top: 10px; }
  .btn { position: relative; background: #1c1c26; border: 1px solid #2e2e3c; border-radius: 12px; color: #e8e8f0; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; transition: 0.1s; font-weight: 600; overflow: hidden; }
  .btn:active { background: #252533; transform: scale(0.94); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-up { grid-column: 2; grid-row: 1; } .btn-left { grid-column: 1; grid-row: 2; } .btn-down { grid-column: 2; grid-row: 2; } .btn-right { grid-column: 3; grid-row: 2; }
  .btn-shoot { grid-column: 4; grid-row: 2; background: #a02020; font-size: 20px; } .btn-shoot:active { background: #c02828; }
  .btn-wall { grid-column: 4; grid-row: 1; background: #4a5a8a; font-size: 18px; } .btn-wall:active { background: #5a6a9a; }
  .btn-farm { grid-column: 5; grid-row: 1; background: #4a8a5a; font-size: 18px; } .btn-farm:active { background: #5a9a6a; }
  .btn-gun { grid-column: 5; grid-row: 2; background: #8a5a4a; font-size: 18px; } .btn-gun:active { background: #9a6a5a; }
  .players-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; justify-content: center; width: 100%; }
  .player-chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
  .waiting-box { background: #1c1c26; border: 1px solid #2e2e3c; border-radius: 12px; padding: 16px; width: 100%; text-align: center; margin: 10px 0; }
  .waiting-count { font-size: 42px; font-weight: 900; color: #9bb8ff; letter-spacing: 4px; margin: 6px 0; }
  .waiting-timer { font-size: 60px; font-weight: 900; color: #2ecc71; margin: 6px 0; text-shadow: 0 0 30px rgba(46,204,113,0.6); }
  .hud { display: flex; gap: 12px; margin: 8px 0; font-size: 13px; font-weight: 700; align-items: center; padding: 8px 14px; background: #1c1c26; border-radius: 10px; border: 1px solid #2e2e3c; min-width: 380px; justify-content: center; flex-wrap: wrap; }
  .hud .hp { color: #2ecc71; } .hud .hp.low { color: #e74c3c; } .hud .coins { color: #f1c40f; } .hud .kills { color: #e74c3c; } .hud .cd { color: #f39c12; min-width: 70px; text-align: center; } .hud .cd.ready { color: #2ecc71; }
  .hud .shield-indicator { color: #00e0ff; } .hud .big-indicator { color: #ff8800; }
  .hud .timer-indicator { color: #9bb8ff; min-width: 50px; text-align: center; }
  .hud .timer-indicator.warn { color: #f39c12; } .hud .timer-indicator.danger { color: #e74c3c; animation: pulseDanger 0.8s infinite; }
  @keyframes pulseDanger { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #winBanner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); background: linear-gradient(135deg, #f1c40f, #e67e22); color: #fff; padding: 30px 50px; border-radius: 20px; font-size: 32px; font-weight: 800; letter-spacing: 4px; text-align: center; box-shadow: 0 20px 80px rgba(241,196,15,0.6); opacity: 0; pointer-events: none; transition: opacity 0.4s, transform 0.4s; z-index: 1000; line-height: 1.4; }
  #winBanner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #winBanner small { display: block; font-size: 18px; font-weight: 600; letter-spacing: 2px; margin-top: 10px; color: #fff; }
  #countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 180px; font-weight: 900; color: #fff; text-shadow: 0 0 40px #5a7fd8, 0 0 80px #4a6fd8, 0 0 120px #3a5fcd; z-index: 900; pointer-events: none; opacity: 0; letter-spacing: 8px; font-family: 'Arial Black', Arial, sans-serif; }
  #countdown.show { animation: countPulse 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes countPulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(3); } 40% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } }
  #countdown.go { color: #2ecc71; text-shadow: 0 0 40px #2ecc71, 0 0 80px #27ae60, 0 0 120px #1e8449; font-size: 130px; }
  #emotionBtn { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #4a6fd8, #3a5fcd); border: 2px solid #5a7fd8; color: #fff; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(74,111,216,0.5); z-index: 500; transition: transform 0.2s, box-shadow 0.2s; user-select: none; }
  #emotionBtn:active { transform: scale(0.9); } #emotionBtn.hidden { display: none; }
  #emotionPanel { position: fixed; bottom: 96px; right: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: rgba(28,28,38,0.95); border: 1px solid #2e2e3c; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 499; opacity: 0; transform: translateY(20px) scale(0.8); pointer-events: none; transition: opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #emotionPanel.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .emotion-option { width: 48px; height: 48px; border-radius: 12px; background: #252533; border: 1px solid #2e2e3c; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s, background 0.1s; user-select: none; }
  .emotion-option:active { transform: scale(0.85); background: #3a5fcd; }
  #emotionCooldownBar { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: conic-gradient(#e74c3c 0deg, rgba(231,76,60,0.2) 0deg); pointer-events: none; z-index: 501; display: none; }
  #emotionCooldownBar.show { display: block; }
  #emotionCooldownText { position: fixed; bottom: 42px; right: 42px; font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 502; pointer-events: none; display: none; }
  #emotionCooldownText.show { display: block; }
  @keyframes titleSlam { 0% { transform: scale(6) rotate(-15deg); opacity: 0; filter: blur(20px); } 50% { transform: scale(0.9) rotate(2deg); opacity: 1; filter: blur(0); } 70% { transform: scale(1.15) rotate(-2deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  #menuScreen h1 { animation: titleSlam 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  #menuScreen .hint { animation: fadeInUp 0.5s 0.6s both; }
  #menuScreen #nameInput { animation: fadeInUp 0.5s 0.75s both; }
  #menuScreen #playBtn { animation: fadeInUp 0.5s 0.9s both; }
  #menuScreen #menuStatus { animation: fadeInUp 0.5s 1.05s both; }
  #bgFx { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .bg-spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffcc44; box-shadow: 0 0 12px #ff8800, 0 0 24px #ff4400; pointer-events: none; }
  @keyframes sparkFly { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
</style>
</head>
<body>

<div id="bgFx"></div>
<div id="winBanner"></div>
<div id="countdown"></div>

<h1 id="mainTitle">CUBE WAR</h1>

<div class="screen active" id="menuScreen">
  <div class="hint">Введи имя и играй. Заходи один или с друзьями.</div>
  <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="12">
  <button class="big-btn" id="playBtn">▶ ИГРАТЬ</button>
  <div class="status" id="menuStatus"></div>
</div>

<div class="screen" id="waitingScreen">
  <div class="hint">Ждём игроков...</div>
  <div class="waiting-box">
    <div class="hint">Игроков на сервере:</div>
    <div class="waiting-count" id="waitCount">0 / 6</div>
    <div class="players-bar" id="waitPlayers"></div>
    <div id="waitTimerWrap" style="display:none;">
      <div class="hint">До старта:</div>
      <div class="waiting-timer" id="waitTimer">20</div>
    </div>
    <div class="hint" id="waitHint">Нужно минимум 2 игрока</div>
  </div>
  <div class="status" id="waitStatus"></div>
</div>

<div class="screen" id="gameScreen">
  <div class="hud">
    <span class="hp" id="hpWrap">❤️ <span id="hpView">100</span></span>
    <span class="coins">💰 <span id="coinsView">500</span></span>
    <span class="kills">💀 <span id="killsView">0</span></span>
    <span class="cd ready" id="cdView">КД: 0.0</span>
    <span class="shield-indicator" id="shieldInd" style="display:none;">🛡 <span id="shieldTime">0</span></span>
    <span class="big-indicator" id="bigInd" style="display:none;">🔵 <span id="bigTime">0</span></span>
    <span class="timer-indicator" id="timerInd">⏱ 0:00</span>
  </div>
  <div id="gameCanvasWrap"></div>
  <div class="controls">
    <button class="btn btn-farm" id="farmBtn">🏭</button>
    <button class="btn btn-wall" id="wallBtn">▩</button>
    <button class="btn btn-up" data-dir="up">↑</button>
    <button class="btn btn-left" data-dir="left">←</button>
    <button class="btn btn-down" data-dir="down">↓</button>
    <button class="btn btn-right" data-dir="right">→</button>
    <button class="btn btn-shoot" id="shootBtn">◆</button>
    <button class="btn btn-gun" id="gunBtn">🔫</button>
  </div>
</div>

<button id="emotionBtn" class="hidden">💬</button>
<div id="emotionPanel">
  <div class="emotion-option" data-emoji="😂">😂</div>
  <div class="emotion-option" data-emoji="😡">😡</div>
  <div class="emotion-option" data-emoji="😱">😱</div>
  <div class="emotion-option" data-emoji="👍">👍</div>
  <div class="emotion-option" data-emoji="🔥">🔥</div>
  <div class="emotion-option" data-emoji="❤️">❤️</div>
  <div class="emotion-option" data-emoji="😎">😎</div>
  <div class="emotion-option" data-emoji="💀">💀</div>
</div>
<div id="emotionCooldownBar"></div>
<div id="emotionCooldownText"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // ============================================================
  // CUBE WAR — PixiJS v8 (WebGL) с красивой графикой
  // ============================================================

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0f0f16'); } catch(e) {}
    try { tg.setBackgroundColor('#0f0f16'); } catch(e) {}
    try { tg.enableClosingConfirmation(); } catch(e) {}
  }
  function haptic(type = 'light') {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === 'shot') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'hit') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'emotion') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'bonus') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'explosion') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'count') tg.HapticFeedback.impactOccurred('medium');
      else tg.HapticFeedback.impactOccurred('light');
    } catch(e) {}
  }

  let W = 1200, H = 1200;
  const VIEW_W = 800, VIEW_H = 800;
  const CUBE = 50;
  const STEP = 50;
  const BULLET_STEP = 30;
  const BULLET_LIFE = 0.6;
  const EMOTION_CD = 6;
  const EMOTION_LIFE = 3;

  let socket = null;
  let mySid = null;
  let players = {};
  let me = null;
  let myCoins = 500;
  let myHp = 100;
  let myKills = 0;
  let walls = {};
  let farms = {};
  let crates = {};
  let bullets = [];
  let particles = [];
  let floatingTexts = [];
  let activeEmotions = [];
  let moving = false;
  let gameStarted = false;
  let countdownActive = false;
  let myShieldUntil = 0;
  let myBigBulletsUntil = 0;
  let zone = { active: false, left: 0, top: 0, right: 0, bottom: 0, warn: false };
  let gameElapsed = 0;
  let cameraX = 0, cameraY = 0;
  let COOLDOWN = 0.5;
  let lastAction = 0;
  let emotionCooldownUntil = 0;

  let app = null;
  let world = null;
  let zoneGraphics = null;
  const sprites = {};
  const wallSprites = {};
  const farmSprites = {};
  const crateSprites = {};
  const textStyle = { fontFamily: 'Arial', fontSize: 12, fill: 0x000000, fontWeight: 'bold', stroke: 0xffffff, strokeThickness: 3 };
  const emojiStyle = { fontFamily: 'Arial', fontSize: 44 };

  const $ = id => document.getElementById(id);
  const menuScreen = $('menuScreen'), waitingScreen = $('waitingScreen'), gameScreen = $('gameScreen');
  const nameInput = $('nameInput');
  const playBtn = $('playBtn'), menuStatus = $('menuStatus');
  const waitCount = $('waitCount'), waitPlayers = $('waitPlayers');
  const waitTimer = $('waitTimer'), waitTimerWrap = $('waitTimerWrap');
  const waitHint = $('waitHint'), waitStatus = $('waitStatus');
  const gameCanvasWrap = $('gameCanvasWrap');
  const hpView = $('hpView'), coinsView = $('coinsView'), killsView = $('killsView');
  const cdView = $('cdView'), hpWrap = $('hpWrap');
  const winBanner = $('winBanner');
  const countdownEl = $('countdown');
  const emotionBtn = $('emotionBtn');
  const emotionPanel = $('emotionPanel');
  const emotionCooldownBar = $('emotionCooldownBar');
  const emotionCooldownText = $('emotionCooldownText');
  const shieldInd = $('shieldInd'), shieldTime = $('shieldTime');
  const bigInd = $('bigInd'), bigTime = $('bigTime');
  const timerInd = $('timerInd');
  const bgFx = $('bgFx');

  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    const name = u.first_name || u.username || '';
    if (name) nameInput.value = name.slice(0, 12);
  }

  // === Цвета ===
  function hexToInt(hex) { return parseInt(hex.replace('#',''), 16); }
  function lighten(color, percent) {
    const num = typeof color === 'number' ? color : parseInt(String(color).replace('#',''), 16);
    let r = Math.min(255, ((num >> 16) & 0xff) + percent);
    let g = Math.min(255, ((num >> 8) & 0xff) + percent);
    let b = Math.min(255, (num & 0xff) + percent);
    return (r << 16) | (g << 8) | b;
  }
  function darken(color, percent) { return lighten(color, -percent); }

  // === ВЗРЫВ НА ФОНЕ ===
  function createBgExplosion() {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (let i = 0; i < 90; i++) {
      const spark = document.createElement('div');
      spark.className = 'bg-spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 500;
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';
      spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      spark.style.animation = `sparkFly ${0.8 + Math.random() * 1.2}s cubic-bezier(0.15, 0.6, 0.4, 1) forwards`;
      spark.style.animationDelay = (Math.random() * 0.3) + 's';
      spark.style.background = ['#ffcc44', '#ff8800', '#ff4400', '#fff', '#ff2200'][Math.floor(Math.random() * 5)];
      bgFx.appendChild(spark);
      setTimeout(() => spark.remove(), 2500);
    }
    haptic('explosion');
  }
  setTimeout(createBgExplosion, 300);

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    emotionBtn.classList.toggle('hidden', id !== 'gameScreen');
    if (id !== 'gameScreen') emotionPanel.classList.remove('show');
  }

  function startCountdown() {
    countdownActive = true;
    let step = 3;
    function tick() {
      if (step > 0) {
        countdownEl.textContent = step;
        countdownEl.classList.remove('show', 'go');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('show');
        haptic('count');
        step--;
        setTimeout(tick, 1000);
      } else {
        countdownEl.textContent = 'GO!';
        countdownEl.classList.remove('show');
        countdownEl.classList.add('go');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('show');
        haptic('explosion');
        setTimeout(() => { countdownEl.classList.remove('show', 'go'); countdownActive = false; }, 1000);
      }
    }
    tick();
  }

  function canAct() {
    if (countdownActive) return false;
    return (performance.now() - lastAction) / 1000 >= COOLDOWN;
  }

  function updateCD() {
    const elapsed = (performance.now() - lastAction) / 1000;
    const left = Math.max(0, COOLDOWN - elapsed);
    if (left > 0) {
      cdView.textContent = 'КД: ' + left.toFixed(1);
      cdView.classList.remove('ready');
      document.querySelectorAll('.btn').forEach(b => {
        if (b.id === 'farmBtn' || b.id === 'wallBtn' || b.id === 'shootBtn') { b.disabled = true; b.classList.add('recharging'); }
      });
    } else {
      cdView.textContent = 'КД: 0.0';
      cdView.classList.add('ready');
      document.querySelectorAll('.btn').forEach(b => { b.disabled = false; b.classList.remove('recharging'); });
    }
  }
  setInterval(updateCD, 50);

  function updateBonusTimers() {
    const now = Date.now() / 1000;
    const shieldLeft = Math.max(0, myShieldUntil - now);
    const bigLeft = Math.max(0, myBigBulletsUntil - now);
    shieldInd.style.display = shieldLeft > 0 ? 'inline' : 'none';
    shieldTime.textContent = shieldLeft.toFixed(1);
    bigInd.style.display = bigLeft > 0 ? 'inline' : 'none';
    bigTime.textContent = bigLeft.toFixed(1);
  }
  setInterval(updateBonusTimers, 100);

  function updateTimer() {
    const m = Math.floor(gameElapsed / 60);
    const s = Math.floor(gameElapsed % 60);
    timerInd.textContent = `⏱ ${m}:${s.toString().padStart(2,'0')}`;
    timerInd.classList.remove('warn', 'danger');
    if (gameElapsed >= 60 && !zone.active) timerInd.classList.add('warn');
    else if (zone.active) timerInd.classList.add('danger');
  }
  setInterval(updateTimer, 200);

  function updateEmotionCooldown() {
    const now = Date.now();
    const left = Math.max(0, (emotionCooldownUntil - now) / 1000);
    if (left > 0) {
      emotionCooldownBar.classList.add('show');
      emotionCooldownText.classList.add('show');
      emotionCooldownText.textContent = Math.ceil(left);
      const deg = (1 - left / EMOTION_CD) * 360;
      emotionCooldownBar.style.background = `conic-gradient(#e74c3c ${deg}deg, rgba(231,76,60,0.2) ${deg}deg)`;
    } else {
      emotionCooldownBar.classList.remove('show');
      emotionCooldownText.classList.remove('show');
    }
  }
  setInterval(updateEmotionCooldown, 100);

  function showWinBanner(text) {
    winBanner.innerHTML = text;
    winBanner.classList.add('show');
    haptic('hit');
  }

  // ============================================================
  // PIXI
  // ============================================================
  async function initPixi() {
    app = new PIXI.Application();
    await app.init({ width: VIEW_W, height: VIEW_H, background: 0xffffff, antialias: true, resolution: 1, autoDensity: false });
    gameCanvasWrap.appendChild(app.canvas);
    world = new PIXI.Container();
    app.stage.addChild(world);

    // Сетка
    const grid = new PIXI.Graphics();
    grid.lineStyle(1, 0xe8e8ec, 1);
    for (let x = 0; x <= W; x += 50) { grid.moveTo(x, 0); grid.lineTo(x, H); }
    for (let y = 0; y <= H; y += 50) { grid.moveTo(0, y); grid.lineTo(W, y); }
    world.addChild(grid);
    world._grid = grid;

    zoneGraphics = new PIXI.Graphics();
    world.addChild(zoneGraphics);
  }

  // === КУБИК ===

  function updateCubeSprite(sid, p, isMe) {
    let s = sprites[sid];
    if (!s) { createCubeSprite(sid, p.color); s = sprites[sid]; }
    s.container.x = p.x - CUBE / 2;
    s.container.y = p.y - CUBE / 2;
    s.name.text = p.name;

    const curHp = isMe ? myHp : (p.hp || 100);
    const ratio = Math.max(0, curHp / 100);
    s.hpFg.clear();
    s.hpFg.beginFill(ratio > 0.6 ? 0x2ecc71 : (ratio > 0.3 ? 0xf39c12 : 0xe74c3c));
    s.hpFg.drawRect(0, -20, 54 * ratio, 7);
    s.hpFg.endFill();

    const lvl = p.gun_level || 0;
    const angle = Math.atan2(p.dir.y, p.dir.x);
    s.barrelContainer.rotation = angle;
    s.barrel.clear();
    s.barrel.beginFill(darken(hexToInt(p.color), 50));
    s.barrel.drawRect(0, -5, 22 + lvl * 5, 10 + lvl * 2);
    s.barrel.endFill();
    const big = (p.big_bullets_until || 0) > Date.now() / 1000;
    s.barrel.beginFill(big ? 0xff8800 : (lvl >= 4 ? 0x00e0ff : 0x222222));
    s.barrel.drawRect(22 + lvl * 5 - 4, -5 - lvl - 1, 6, 10 + lvl * 2 + 2);
    s.barrel.endFill();

    const shielded = (p.shield_until || 0) > Date.now() / 1000;
    s.shield.visible = shielded;
    if (shielded) {
      const t = Date.now() / 200;
      s.shield.scale.set(1 + Math.sin(t) * 0.08);
    }
  }

  // === ФЕРМА (мельница) ===
  function createFarmSprite(fid, f) {
    const c = new PIXI.Container();

    const g = new PIXI.Graphics();
    // тень
    g.beginFill(0x000000, 0.15);
    g.drawRect(-24, -24, 52, 52);
    g.endFill();
    // корпус
    g.beginFill(0xb8901a);
    g.drawRect(-22, -22, 44, 44);
    g.endFill();
    g.beginFill(0xd4a017);
    g.drawRect(-22, -22, 44, 22);
    g.endFill();
    // обводка
    g.lineStyle(2.5, 0x6a4a0a, 1);
    g.drawRect(-22, -22, 44, 44);
    // дверь
    g.beginFill(0x4a3005);
    g.drawRect(-5, 2, 10, 14);
    g.endFill();
    // крыша
    g.beginFill(0x8b0000);
    g.moveTo(-26, -22); g.lineTo(0, -38); g.lineTo(26, -22); g.closePath();
    g.endFill();
    g.lineStyle(2, 0x4a0000, 1);
    g.moveTo(-26, -22); g.lineTo(0, -38); g.lineTo(26, -22);
    c.addChild(g);

    // лопасти
    const wheel = new PIXI.Container();
    wheel.x = 0; wheel.y = -30;
    const wheelG = new PIXI.Graphics();
    wheelG.beginFill(0x8b5a2b);
    for (let i = 0; i < 4; i++) {
      wheelG.rotate = i * Math.PI / 2;
      wheelG.drawRect(0, -3, 26, 6);
    }
    // проще нарисовать 4 прямоугольника через rotate
    wheelG.clear();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      wheelG.beginFill(0x8b5a2b);
      wheelG.drawRect(0, -3, 26, 6);
      wheelG.endFill();
      // rotate следующего
      wheelG.rotation = 0; // будет в wheel.rotation
    }
    // вместо этого — 4 раза один и тот же, но повёрнутый контейнер
    wheel.removeChildren();
    for (let i = 0; i < 4; i++) {
      const blade = new PIXI.Graphics();
      blade.beginFill(0x8b5a2b);
      blade.drawRect(0, -3, 26, 6);
      blade.endFill();
      blade.rotation = i * Math.PI / 2;
      wheel.addChild(blade);

    const hub = new PIXI.Graphics();
    hub.beginFill(0x4a2a0a);
    hub.drawCircle(0, 0, 5);
    hub.endFill();
    wheel.addChild(hub);
    c.addChild(wheel);

    // HP

    hpBg.beginFill(0x000000, 0.5);
    hpBg.drawRect(-21, -46, 42, 7);
    hpBg.endFill();
    hpBg.beginFill(0x111111);
    hpBg.drawRect(-20, -45, 40, 5);
    hpBg.endFill();

    const hpFg = new PIXI.Graphics();
    hpFg.beginFill(0x2ecc71);
    hpFg.drawRect(-20, -45, 40, 5);
    hpFg.endFill();
    c.addChild(hpFg);

    c.x = f.x; c.y = f.y;
    world.addChild(c);
    farmSprites[fid] = { container: c, wheel, hpFg };

  // === ЧАСТИЦЫ ===
  function spawnParticles(x, y, color, count = 8) {
    if (particles.length > 300) return;
    const tint = typeof color === 'number' ? color : hexToInt(color);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      const g = new PIXI.Graphics();
      g.beginFill(tint);
      g.drawCircle(0, 0, 3 + Math.random() * 3);
      g.endFill();
      g.x = x; g.y = y;
      world.addChild(g);
      particles.push({ g, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1 });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const part = particles[i];
      part.g.x += part.vx;
      part.g.y += part.vy;
      part.vx *= 0.94; part.vy *= 0.94;
      part.life -= 0.03;
      part.g.alpha = part.life;
      part.g.scale.set(part.life);
      if (part.life <= 0) {
        world.removeChild(part.g);
        particles.splice(i, 1);
      }
    }
  }

  // === ПУЛИ ===
  function spawnBullet(data, isBig) {
    const count = data.bullets || 1;
    const baseAngle = Math.atan2(data.dir.y, data.dir.x);
    const spread = 0.15;
    const colorInt = hexToInt(data.color);
    for (let i = 0; i < count; i++) {
      const offset = (i - (count - 1) / 2) * spread;
      const a = baseAngle + offset;
      const g = new PIXI.Container();
      // свечение
      const glow = new PIXI.Graphics();
      glow.beginFill(colorInt, 0.3);
      glow.drawCircle(0, 0, isBig ? 22 : 14);
      glow.endFill();
      g.addChild(glow);
      // ядро
      const core = new PIXI.Graphics();
      core.beginFill(isBig ? 0xffaa33 : (data.pierce ? 0x00e0ff : 0xffffff));
      core.drawCircle(0, 0, isBig ? 12 : 6);
      core.endFill();
      g.addChild(core);
      const inner = new PIXI.Graphics();
      inner.beginFill(colorInt);
      inner.drawCircle(0, 0, isBig ? 7 : 4);
      inner.endFill();
      g.addChild(inner);
      g.x = data.x; g.y = data.y;
      world.addChild(g);
      bullets.push({
        g, glow, dx: Math.cos(a), dy: Math.sin(a),
        owner: data.sid, age: 0, dmg: data.dmg || 5,
        pierce: data.pierce, radius: isBig ? 12 : 6,
        big: isBig, hit_targets: [],
      });
    }
    spawnParticles(data.x + data.dir.x * 30, data.y + data.dir.y * 30, colorInt, isBig ? 14 : 8);
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.g.x += b.dx * BULLET_STEP;
      b.g.y += b.dy * BULLET_STEP;
      b.age += 0.03;
      // пульсация
      const t = Date.now() / 100;
      b.g.scale.set(1 + Math.sin(t) * 0.1);

      let hitSomething = false;
      for (const wid in walls) {
        const w = walls[wid];
        if (Math.abs(w.x - b.g.x) < 25 && Math.abs(w.y - b.g.y) < 25) {
          socket.emit('hit_wall', { wall_id: wid });
          spawnParticles(b.g.x, b.g.y, 0x8fa8d8, 5);
          if (!b.pierce) hitSomething = true;
          break;
        }
      }
      if (!hitSomething) {
        for (const fid in farms) {
          const f = farms[fid];
          if (Math.abs(f.x - b.g.x) < 30 && Math.abs(f.y - b.g.y) < 30) {
            socket.emit('hit_farm', { farm_id: fid });
            spawnParticles(b.g.x, b.g.y, 0xd4a017, 5);
            if (!b.pierce) hitSomething = true;
            break;
          }
        }
      }
      if (!hitSomething) {
        for (const cid in crates) {
          const c = crates[cid];
          if (c.hp <= 0) continue;
          if (Math.abs(c.x - b.g.x) < 28 && Math.abs(c.y - b.g.y) < 28) {
            socket.emit('hit_crate', { crate_id: cid });
            spawnParticles(b.g.x, b.g.y, 0xc08040, 6);
            if (!b.pierce) hitSomething = true;
            break;
          }
        }
      }
      if (!hitSomething) {
        for (const sid in players) {
          if (sid === b.owner) continue;
          if (b.hit_targets.includes(sid)) continue;
          const p = players[sid];
          if (p.alive === false) continue;
          const dx = p.x - b.g.x, dy = p.y - b.g.y;
          if (dx * dx + dy * dy < (25 + b.radius) * (25 + b.radius)) {
            socket.emit('hit', { target_sid: sid, dmg: b.dmg, killer: b.owner });
            b.hit_targets.push(sid);
            spawnParticles(b.g.x, b.g.y, 0xff4040, 6);
            if (!b.pierce) hitSomething = true;
            break;
          }
        }
      }

      if (hitSomething || b.age >= BULLET_LIFE || b.g.x < 0 || b.g.x > W || b.g.y < 0 || b.g.y > H) {
        // взрыв пули
        for (let k = 0; k < 4; k++) {
          spawnParticles(b.g.x, b.g.y, b.big ? 0xffaa33 : 0xffffff, 2);
        }
        world.removeChild(b.g);
        bullets.splice(i, 1);
      }
    }
  }

  // === ЗОНА ===
  function drawZone() {
    zoneGraphics.clear();
    if (zone.active) {
      zoneGraphics.beginFill(0xe74c3c, 0.35);
      const zL = zone.left, zT = zone.top, zR = W - zone.right, zB = H - zone.bottom;
      zoneGraphics.drawRect(0, 0, W, zT);
      zoneGraphics.drawRect(0, zB, W, H - zB);
      zoneGraphics.drawRect(0, zT, zL, zB - zT);
      zoneGraphics.drawRect(zR, zT, W - zR, zB - zT);
      zoneGraphics.endFill();
      zoneGraphics.lineStyle(3, zone.warn ? 0xff6464 : 0xe74c3c, 0.9);
      zoneGraphics.drawRect(zL, zT, zR - zL, zB - zT);
    }
  }

  // === СОКЕТ ===
  function connect() {
    socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    socket.on('connect', () => { mySid = socket.id; });

    socket.on('joined', (data) => {
      mySid = socket.id;
      if (data.world_w) W = data.world_w;
      if (data.world_h) H = data.world_h;
      COOLDOWN = data.cooldown || 0.5;
      showScreen('waitingScreen');
    });

    socket.on('server_update', (data) => {
      players = data.players || {};
      const list = Object.values(players);
      waitCount.textContent = `${list.length} / ${data.max_players || 6}`;
      waitPlayers.innerHTML = '';
      list.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'player-chip';
        chip.style.background = p.color;
        chip.textContent = p.name;
        waitPlayers.appendChild(chip);
      });
      if (data.countdown_active) {
        waitTimerWrap.style.display = 'block';
        waitTimer.textContent = data.countdown_left;
        waitHint.textContent = 'Игра начнётся через...';
      } else {
        waitTimerWrap.style.display = 'none';
        waitHint.textContent = list.length < 2 ? 'Нужно минимум 2 игрока. Ждём...' : 'Приготовься...';
      }
    });

    socket.on('game_started', (data) => {
      mySid = socket.id;
      players = data.players || {};
      walls = data.walls || {};
      farms = data.farms || {};
      crates = data.crates || {};
      if (data.world_w) W = data.world_w;
      if (data.world_h) H = data.world_h;
      me = players[mySid];
      if (me) { myCoins = me.coins || 500; myHp = me.hp || 100; myKills = me.kills || 0; }
      gameStarted = true;

      // очистка
      for (const sid in sprites) { world.removeChild(sprites[sid].container); delete sprites[sid]; }
      for (const wid in wallSprites) { world.removeChild(wallSprites[wid].container); delete wallSprites[wid]; }
      for (const fid in farmSprites) { world.removeChild(farmSprites[fid].container); delete farmSprites[fid]; }
      for (const cid in crateSprites) { world.removeChild(crateSprites[cid].container); delete crateSprites[cid]; }
      for (const b of bullets) world.removeChild(b.g);
      for (const pa of particles) world.removeChild(pa.g);
      bullets = []; particles = []; floatingTexts = []; activeEmotions = [];

      for (const sid in players) updateCubeSprite(sid, players[sid], sid === mySid);
      for (const wid in walls) updateWallSprite(wid, walls[wid]);
      for (const fid in farms) updateFarmSprite(fid, farms[fid]);
      for (const cid in crates) updateCrateSprite(cid, crates[cid]);

      updateHUD();
      showScreen('gameScreen');
      if (me) { cameraX = me.x - VIEW_W/2; cameraY = me.y - VIEW_H/2; }
      startCountdown();
    });

    socket.on('server_reset', () => {
      gameStarted = false;
      for (const b of bullets) world.removeChild(b.g);
      for (const pa of particles) world.removeChild(pa.g);
      bullets = []; particles = [];
      showScreen('waitingScreen');
    });

    socket.on('tick_update', (data) => {
      if (data.players) {
        for (const sid in data.players) {
          if (players[sid]) {
            players[sid].coins = data.players[sid].coins;
            players[sid].hp = data.players[sid].hp;
            if (data.players[sid].kills !== undefined) players[sid].kills = data.players[sid].kills;
            players[sid].shield_until = data.players[sid].shield_until || 0;
            players[sid].big_bullets_until = data.players[sid].big_bullets_until || 0;
          }
        }
        if (me && players[mySid]) {
          myCoins = players[mySid].coins;
          myHp = players[mySid].hp;
          myKills = players[mySid].kills;
          myShieldUntil = players[mySid].shield_until || 0;
          myBigBulletsUntil = players[mySid].big_bullets_until || 0;
        }
        updateHUD();
      }
      if (data.zone) zone = data.zone;
      if (typeof data.elapsed === 'number') gameElapsed = data.elapsed;
    });

    socket.on('zone_warning', () => { haptic('explosion'); });
    socket.on('zone_update', (data) => {
      zone.left = data.left; zone.top = data.top;
      zone.right = data.right; zone.bottom = data.bottom;
      zone.active = true;
    });

    socket.on('player_moved', (data) => {
      const p = players[data.sid];
      if (p) { p.x = data.x; p.y = data.y; p.dir = data.dir; }
    });

    socket.on('bullet_fired', (data) => { spawnBullet(data, !!data.big); });

    socket.on('player_hit', (data) => {
      if (data.sid === mySid) myHp = data.hp;
      else { const p = players[data.sid]; if (p) p.hp = data.hp; }
      const p = players[data.sid];
      if (p) spawnParticles(p.x, p.y, data.zone ? 0xff2020 : 0xff4040, 8);
      haptic('hit');
      updateHUD();
    });

    socket.on('player_shielded', (data) => {
      const p = players[data.sid];
      if (p) spawnParticles(p.x, p.y, 0x00e0ff, 8);
      if (data.sid === mySid) haptic('hit');
    });

    socket.on('player_died', (data) => {
      const p = players[data.sid];
      if (p) { p.hp = 0; p.alive = false; spawnParticles(p.x, p.y, hexToInt(p.color), 15); }
    });

    socket.on('wall_placed', (data) => {
      walls[data.id] = { x: data.x, y: data.y, hp: data.hp };
      updateWallSprite(data.id, walls[data.id]);
      if (data.my_coins !== undefined) myCoins = data.my_coins;
      updateHUD();
    });
    socket.on('wall_hit', (data) => { if (walls[data.id]) walls[data.id].hp = data.hp; });
    socket.on('wall_destroyed', (data) => {
      if (wallSprites[data.id]) { world.removeChild(wallSprites[data.id].container); delete wallSprites[data.id]; }
      delete walls[data.id];
    });

    socket.on('farm_placed', (data) => {
      farms[data.id] = { x: data.x, y: data.y, hp: data.hp, last_income: 0 };
      updateFarmSprite(data.id, farms[data.id]);
      if (data.my_coins !== undefined) myCoins = data.my_coins;
      updateHUD();
    });
    socket.on('farm_hit', (data) => { if (farms[data.id]) farms[data.id].hp = data.hp; });
    socket.on('farm_destroyed', (data) => {
      if (farmSprites[data.id]) { world.removeChild(farmSprites[data.id].container); delete farmSprites[data.id]; }
      delete farms[data.id];
    });
    socket.on('farm_income', (data) => {
      if (data.owner === mySid) { myCoins += (data.amount || 1); updateHUD(); }
    });

    socket.on('crate_spawned', (data) => {
      crates[data.id] = { x: data.x, y: data.y, hp: data.hp, max_hp: data.max_hp || 3, bonus: data.bonus };
      updateCrateSprite(data.id, crates[data.id]);
    });
    socket.on('crate_hit', (data) => { if (crates[data.id]) { crates[data.id].hp = data.hp; updateCrateSprite(data.id, crates[data.id]); } });
    socket.on('crate_destroyed', (data) => {
      if (crateSprites[data.id]) { world.removeChild(crateSprites[data.id].container); delete crateSprites[data.id]; }
      delete crates[data.id];
      spawnParticles(data.x, data.y, 0x8b5a2b, 12);
      if (data.player_sid === mySid) haptic('bonus');
    });

    socket.on('gun_upgraded', (data) => {
      if (data.sid === mySid) { if (data.my_coins !== undefined) myCoins = data.my_coins; updateHUD(); }
      else { const p = players[data.sid]; if (p) p.gun_level = data.gun_level; }
    });

    socket.on('emotion_shown', (data) => {
      activeEmotions.push({ x: data.x, y: data.y - 60, emoji: data.emoji, life: EMOTION_LIFE });
      if (data.sid === mySid) haptic('emotion');
    });
    socket.on('emotion_cooldown', (data) => { emotionCooldownUntil = Date.now() + (data.left || 0) * 1000; updateEmotionCooldown(); });

    socket.on('game_over', (data) => {
      showWinBanner('🏆 ' + data.winner + '<small>побеждает!</small>');
      setTimeout(() => { winBanner.classList.remove('show'); }, 4000);
    });

    socket.on('error_msg', (data) => { menuStatus.textContent = data.text; waitStatus.textContent = data.text; });
    socket.on('on_cooldown', () => { haptic('light'); cdView.style.color = '#e74c3c'; setTimeout(() => { cdView.style.color = ''; }, 250); });
    socket.on('disconnect', () => { menuStatus.textContent = 'Отключён'; showScreen('menuScreen'); });
  }

  function updateHUD() {
    hpView.textContent = myHp;
    if (myHp <= 30) hpWrap.classList.add('low'); else hpWrap.classList.remove('low');
    coinsView.textContent = myCoins;
    killsView.textContent = myKills;
  }

  playBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) { menuStatus.textContent = 'Введи имя'; return; }
    if (!socket) connect();
    setTimeout(() => socket.emit('join_server', { name }), 300);
  });

  emotionBtn.addEventListener('click', () => { emotionPanel.classList.toggle('show'); haptic('light'); });
  emotionPanel.querySelectorAll('.emotion-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const emoji = opt.dataset.emoji;
      const now = Date.now();
      if (now < emotionCooldownUntil) { haptic('light'); emotionPanel.classList.remove('show'); return; }
      if (socket && gameStarted) {
        socket.emit('emotion', { emoji });
        emotionCooldownUntil = now + EMOTION_CD * 1000;
        updateEmotionCooldown();
      }
      emotionPanel.classList.remove('show');
      haptic('emotion');
    });
  });
  document.addEventListener('click', (e) => {
    if (!emotionPanel.classList.contains('show')) return;
    if (emotionPanel.contains(e.target)) return;
    if (emotionBtn.contains(e.target)) return;
    emotionPanel.classList.remove('show');
  });

  function move(dir) {
    if (moving || !me || myHp <= 0 || !canAct() || !gameStarted) { if (!canAct()) haptic('light'); return; }
    haptic('light');
    lastAction = performance.now(); updateCD();
    moving = true;
    const dirs = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const d = dirs[dir]; me.dir = d;
    const tx = Math.max(25, Math.min(W - 25, me.x + d.x * STEP));
    const ty = Math.max(25, Math.min(H - 25, me.y + d.y * STEP));
    const sx = me.x, sy = me.y; const dx = tx - sx, dy = ty - sy;
    let i = 0;
    function step() {
      i++;
      if (i > 6) { me.x = tx; me.y = ty; moving = false; socket.emit('move', { x: me.x, y: me.y, dir: me.dir }); return; }
      const t = i / 6;
      me.x = sx + dx * t; me.y = sy + dy * t;
      requestAnimationFrame(step);
    }
    step();
  }

  document.querySelectorAll('.btn').forEach(btn => { if (btn.dataset.dir) btn.addEventListener('click', () => move(btn.dataset.dir)); });
  $('shootBtn').addEventListener('click', () => { if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; } haptic('shot'); lastAction = performance.now(); updateCD(); socket.emit('shoot', {}); });
  $('wallBtn').addEventListener('click', () => { if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; } haptic('light'); lastAction = performance.now(); updateCD(); socket.emit('place_wall', {}); });
  $('farmBtn').addEventListener('click', () => { if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; } haptic('light'); lastAction = performance.now(); updateCD(); socket.emit('place_farm', {}); });
  $('gunBtn').addEventListener('click', () => { if (!me || myHp <= 0 || !gameStarted) return; haptic('light'); socket.emit('upgrade_gun', {}); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') move('up');
    else if (e.key === 'ArrowDown') move('down');
    else if (e.key === 'ArrowLeft') move('left');
    else if (e.key === 'ArrowRight') move('right');
    else if (e.key === ' ') { e.preventDefault(); $('shootBtn').click(); }
    else if (e.key === 'e' || e.key === 'E') { $('wallBtn').click(); }
    else if (e.key === 'q' || e.key === 'Q') { $('farmBtn').click(); }
  });

  // === ГЛАВНЫЙ ЦИКЛ ===
  function gameLoop() {
    if (!app) return;

    if (gameStarted) updateBullets();
    updateParticles();

    for (const sid in players) {
      if (sprites[sid]) updateCubeSprite(sid, players[sid], sid === mySid);
    }
    for (const fid in farms) {
      if (farmSprites[fid]) farmSprites[fid].wheel.rotation += 0.05;
    }

    if (me) {
      const targetCamX = me.x - VIEW_W / 2;
      const targetCamY = me.y - VIEW_H / 2;
      cameraX += (targetCamX - cameraX) * 0.15;
      cameraY += (targetCamY - cameraY) * 0.15;
      cameraX = Math.max(0, Math.min(W - VIEW_W, cameraX));
      cameraY = Math.max(0, Math.min(H - VIEW_H, cameraY));
    }
    world.x = -cameraX;
    world.y = -cameraY;

    drawZone();

    // эмоции
    for (let i = activeEmotions.length - 1; i >= 0; i--) {
      const e = activeEmotions[i];
      if (!e._sprite) {
        e._sprite = new PIXI.Text(e.emoji, emojiStyle);
        e._sprite.anchor.set(0.5);
        e._sprite.x = e.x; e._sprite.y = e.y;
        world.addChild(e._sprite);
      }
      e.life -= 0.02;
      e._sprite.alpha = Math.min(1, e.life);
      e._sprite.y -= 0.5;
      e._sprite.rotation += 0.05;
      if (e.life <= 0) { world.removeChild(e._sprite); activeEmotions.splice(i, 1); }
    }
  }

  (async () => {
    await initPixi();
    app.ticker.add(gameLoop);
    app.ticker.maxFPS = 60;
  })();
</script>
</body>
</html>
