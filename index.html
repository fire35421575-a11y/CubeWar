<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CubeWar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f0f16; color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 8px; overflow: hidden; touch-action: none;
    user-select: none;
  }
  h1 {
    font-size: 20px; font-weight: 800; letter-spacing: 6px;
    color: #fff; margin: 8px 0 4px;
    text-shadow: 0 0 20px rgba(155,184,255,0.5);
  }
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
  .screen.active { display: flex; }
  input {
    background: #1c1c26; border: 1px solid #2e2e3c; color: #fff;
    padding: 14px 16px; border-radius: 10px; font-size: 15px;
    width: 100%; margin: 6px 0; outline: none; font-family: inherit;
    text-align: center; transition: 0.15s;
  }
  input:focus { border-color: #5a7fd8; background: #202030; }
  .big-btn {
    background: linear-gradient(180deg, #4a6fd8, #3a5fcd);
    border: none; color: #fff; padding: 14px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
    margin: 5px 0; transition: 0.15s; font-family: inherit;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.secondary { background: #1c1c26; color: #9bb8ff; border: 1px solid #2e2e3c; }
  .big-btn:disabled { background: #1c1c26; color: #555; cursor: default; text-transform: none; letter-spacing: 0; }
  .big-btn.green { background: linear-gradient(180deg, #2ecc71, #27ae60); }
  .big-btn.ready { background: linear-gradient(180deg, #27ae60, #1e8449); }
  .room-code {
    background: #1c1c26; border: 2px dashed #5a7fd8; color: #9bb8ff;
    padding: 16px; border-radius: 10px; font-size: 28px; font-weight: 800;
    letter-spacing: 8px; margin: 10px 0; user-select: all; text-align: center;
    width: 100%; font-family: 'Courier New', monospace;
  }
  .hint { font-size: 12px; color: #666680; text-align: center; margin: 6px 0; line-height: 1.5; }
  .status { font-size: 12px; color: #666680; margin: 4px 0; text-align: center; }
  canvas {
    background: #fff; border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    touch-action: none; width: 100%; max-width: 600px; height: auto;
    display: block;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(5, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 8px; margin-top: 10px;
  }
  .btn {
    position: relative;
    background: #1c1c26; border: 1px solid #2e2e3c; border-radius: 12px;
    color: #e8e8f0; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none; transition: 0.1s; font-weight: 600;
    overflow: hidden;
  }
  .btn:active { background: #252533; transform: scale(0.94); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-up    { grid-column: 2; grid-row: 1; }
  .btn-left  { grid-column: 1; grid-row: 2; }
  .btn-down  { grid-column: 2; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-shoot { grid-column: 4; grid-row: 2; background: #a02020; font-size: 20px; }
  .btn-shoot:active { background: #c02828; }
  .btn-wall  { grid-column: 4; grid-row: 1; background: #4a5a8a; font-size: 18px; }
  .btn-wall:active { background: #5a6a9a; }
  .btn-farm  { grid-column: 5; grid-row: 1; background: #4a8a5a; font-size: 18px; }
  .btn-farm:active { background: #5a9a6a; }
  .btn-gun   { grid-column: 5; grid-row: 2; background: #8a5a4a; font-size: 18px; }
  .btn-gun:active { background: #9a6a5a; }

  .btn .cd-ring {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
    background: conic-gradient(rgba(0,0,0,0.7) 0deg, transparent 0deg);
    transition: background 0.08s linear;
  }
  .btn .cd-num {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
    opacity: 0;
  }
  .btn.recharging .cd-num { opacity: 1; }

  .players-bar {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0;
    justify-content: center; width: 100%;
  }
  .player-chip {
    padding: 4px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 700; color: #fff; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .player-chip .check { font-size: 12px; opacity: 0.5; }
  .player-chip.ready .check { opacity: 1; color: #2ecc71; }

  .hud {
    display: flex; gap: 12px; margin: 8px 0; font-size: 13px;
    font-weight: 700; align-items: center; padding: 8px 14px;
    background: #1c1c26; border-radius: 10px; border: 1px solid #2e2e3c;
    min-width: 380px; justify-content: center; flex-wrap: wrap;
  }
  .hud .hp { color: #2ecc71; }
  .hud .hp.low { color: #e74c3c; }
  .hud .coins { color: #f1c40f; }
  .hud .kills { color: #e74c3c; }
  .hud .cd { color: #f39c12; min-width: 70px; text-align: center; }
  .hud .cd.ready { color: #2ecc71; }
  .hud .shield-indicator { color: #00e0ff; }
  .hud .big-indicator { color: #ff8800; }
  .hud .timer-indicator { color: #9bb8ff; min-width: 50px; text-align: center; }
  .hud .timer-indicator.warn { color: #f39c12; }
  .hud .timer-indicator.danger { color: #e74c3c; animation: pulseDanger 0.8s infinite; }
  @keyframes pulseDanger {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #winBanner {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    background: linear-gradient(135deg, #f1c40f, #e67e22);
    color: #fff; padding: 30px 50px; border-radius: 20px;
    font-size: 32px; font-weight: 800; letter-spacing: 4px;
    text-align: center; box-shadow: 0 20px 80px rgba(241,196,15,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s, transform 0.4s; z-index: 1000;
    line-height: 1.4;
  }
  #winBanner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #winBanner small {
    display: block; font-size: 18px; font-weight: 600;
    letter-spacing: 2px; margin-top: 10px; color: #fff;
  }

  #emotionBtn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a6fd8, #3a5fcd);
    border: 2px solid #5a7fd8;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(74,111,216,0.5);
    z-index: 500;
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
  }
  #emotionBtn:active { transform: scale(0.9); }
  #emotionBtn.hidden { display: none; }

  #emotionPanel {
    position: fixed;
    bottom: 96px;
    right: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px;
    background: rgba(28,28,38,0.95);
    border: 1px solid #2e2e3c;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 499;
    opacity: 0;
    transform: translateY(20px) scale(0.8);
    pointer-events: none;
    transition: opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #emotionPanel.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .emotion-option {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #252533;
    border: 1px solid #2e2e3c;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, background 0.1s;
    user-select: none;
  }
  .emotion-option:active {
    transform: scale(0.85);
    background: #3a5fcd;
  }

  #emotionCooldownBar {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: conic-gradient(#e74c3c 0deg, rgba(231,76,60,0.2) 0deg);
    pointer-events: none;
    z-index: 501;
    display: none;
  }
  #emotionCooldownBar.show { display: block; }
  #emotionCooldownText {
    position: fixed;
    bottom: 42px;
    right: 42px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    z-index: 502;
    pointer-events: none;
    display: none;
  }
  #emotionCooldownText.show { display: block; }

  @keyframes titleSlam {
    0% { transform: scale(6) rotate(-15deg); opacity: 0; filter: blur(20px); }
    50% { transform: scale(0.9) rotate(2deg); opacity: 1; filter: blur(0); }
    70% { transform: scale(1.15) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  #menuScreen h1 {
    animation: titleSlam 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  #menuScreen .hint { animation: fadeInUp 0.5s 0.6s both; }
  #menuScreen #nameInput { animation: fadeInUp 0.5s 0.75s both; }
  #menuScreen #createBtn { animation: fadeInUp 0.5s 0.9s both; }
  #menuScreen #codeInput { animation: fadeInUp 0.5s 1.05s both; }
  #menuScreen #joinBtn { animation: fadeInUp 0.5s 1.2s both; }
  #menuScreen #menuStatus { animation: fadeInUp 0.5s 1.35s both; }
  #menuScreen.shake-screen {
    animation: shake 0.4s ease-in-out;
  }

  #bgFx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .bg-spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffcc44;
    box-shadow: 0 0 12px #ff8800, 0 0 24px #ff4400;
    pointer-events: none;
  }
  @keyframes sparkFly {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<div id="bgFx"></div>
<div id="winBanner"></div>

<h1 id="mainTitle">CUBE WAR</h1>

<div class="screen active" id="menuScreen">
  <div class="hint">Введи имя и создай комнату — или присоединись по коду.</div>
  <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="12">
  <button class="big-btn" id="createBtn">Создать комнату</button>
  <input type="text" id="codeInput" placeholder="Код комнаты" maxlength="6"
         style="text-transform: uppercase; font-family: 'Courier New', monospace; letter-spacing: 4px;">
  <button class="big-btn secondary" id="joinBtn">Присоединиться</button>
  <div class="status" id="menuStatus"></div>
</div>

<div class="screen" id="lobbyScreen">
  <div class="hint">Код комнаты:</div>
  <div class="room-code" id="roomCode">------</div>
  <div class="hint" id="lobbyHint">Скинь код друзьям. Каждый жмёт «✅ Готов». Хост — «▶️ Начать».</div>
  <button class="big-btn ready" id="readyBtn">✅ Я готов</button>
  <button class="big-btn green" id="startBtn" disabled>▶️ Начать игру</button>
  <div class="players-bar" id="lobbyPlayers"></div>
  <div class="status" id="lobbyStatus"></div>
</div>

<div class="screen" id="gameScreen">
  <div class="hud">
    <span class="hp" id="hpWrap">❤️ <span id="hpView">100</span></span>
    <span class="coins">💰 <span id="coinsView">500</span></span>
    <span class="kills">💀 <span id="killsView">0</span></span>
    <span class="cd ready" id="cdView">КД: 0.0</span>
    <span class="shield-indicator" id="shieldInd" style="display:none;">🛡 <span id="shieldTime">0</span></span>
    <span class="big-indicator" id="bigInd" style="display:none;">🔵 <span id="bigTime">0</span></span>
    <span class="timer-indicator" id="timerInd">⏱ 0:00</span>
  </div>
  <canvas id="canvas" width="800" height="800"></canvas>
  <div class="controls">
    <button class="btn btn-farm" id="farmBtn">🏭<div class="cd-ring"></div><div class="cd-num"></div></button>
    <button class="btn btn-wall" id="wallBtn">▩<div class="cd-ring"></div><div class="cd-num"></div></button>
    <button class="btn btn-up" data-dir="up">↑</button>
    <button class="btn btn-left" data-dir="left">←</button>
    <button class="btn btn-down" data-dir="down">↓</button>
    <button class="btn btn-right" data-dir="right">→</button>
    <button class="btn btn-shoot" id="shootBtn">◆<div class="cd-ring"></div><div class="cd-num"></div></button>
    <button class="btn btn-gun" id="gunBtn">🔫</button>
  </div>
</div>

<button id="emotionBtn">💬</button>
<div id="emotionPanel">
  <div class="emotion-option" data-emoji="😂">😂</div>
  <div class="emotion-option" data-emoji="😡">😡</div>
  <div class="emotion-option" data-emoji="😱">😱</div>
  <div class="emotion-option" data-emoji="👍">👍</div>
  <div class="emotion-option" data-emoji="🔥">🔥</div>
  <div class="emotion-option" data-emoji="❤️">❤️</div>
  <div class="emotion-option" data-emoji="😎">😎</div>
  <div class="emotion-option" data-emoji="💀">💀</div>
</div>
<div id="emotionCooldownBar"></div>
<div id="emotionCooldownText"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0f0f16'); } catch(e) {}
    try { tg.setBackgroundColor('#0f0f16'); } catch(e) {}
    try { tg.enableClosingConfirmation(); } catch(e) {}
  }
  function haptic(type = 'light') {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === 'shot') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'hit') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'emotion') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'bonus') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'explosion') tg.HapticFeedback.impactOccurred('heavy');
      else tg.HapticFeedback.impactOccurred('light');
    } catch(e) {}
  }

  // ==== ЛИМИТЫ (оптимизация) ====
  const MAX_PARTICLES = 120;
  const MAX_FRAGMENTS = 60;
  const MAX_FLOATING = 12;
  const MAX_EMOTIONS = 8;

  // ==== КОНСТАНТЫ ====
  let W = 1400, H = 1400;
  const VIEW_W = 800, VIEW_H = 800;
  const CUBE = 50, HALF = CUBE / 2;
  const STEP = 50, ANIM = 6;
  const BULLET_STEP = 30;
  const BULLET_LIFE = 0.6;
  const WALL_SIZE = 50;
  const EMOTION_CD = 6;
  const EMOTION_LIFE = 3;
  const CRATE_SIZE = 50;
  const TARGET_FPS = 60;
  const FRAME_INTERVAL = 1000 / TARGET_FPS;

  // ==== СОСТОЯНИЕ ====
  let socket = null;
  let mySid = null;
  let myColor = "#1a1a1a";
  let roomCode = "";
  let players = {};
  let me = null;
  let myCoins = 500;
  let myHp = 100;
  let myKills = 0;
  let walls = {};
  let farms = {};
  let crates = {};
  let GUN_LEVELS = [];
  let FARM_COST = 20;
  let WALL_COST = 10;
  let COOLDOWN = 0.5;
  let lastAction = 0;
  let emotionCooldownUntil = 0;
  let bullets = [];
  let particles = [];
  let hitFlashes = [];
  let wallFragments = [];
  let floatingTexts = [];
  let activeEmotions = [];
  let moving = false;
  let gameStarted = false;
  let myShieldUntil = 0;
  let myBigBulletsUntil = 0;
  let zone = { active: false, left: 0, top: 0, right: 0, bottom: 0, warn: false };
  let gameElapsed = 0;
  let cameraX = 0, cameraY = 0;
  let zoneFlashTime = 0;

  // ==== РЕНДЕР-ЛУП ====
  let loopRunning = false;
  let lastFrame = 0;
  let minimapCounter = 0;

  const $ = id => document.getElementById(id);
  const menuScreen = $('menuScreen'), lobbyScreen = $('lobbyScreen'), gameScreen = $('gameScreen');
  const nameInput = $('nameInput'), codeInput = $('codeInput');
  const createBtn = $('createBtn'), joinBtn = $('joinBtn'), menuStatus = $('menuStatus');
  const roomCodeEl = $('roomCode'), lobbyPlayers = $('lobbyPlayers');
  const lobbyStatus = $('lobbyStatus');
  const readyBtn = $('readyBtn'), startBtn = $('startBtn');
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const hpView = $('hpView'), coinsView = $('coinsView'), killsView = $('killsView');
  const cdView = $('cdView'), hpWrap = $('hpWrap');
  const winBanner = $('winBanner');
  const emotionBtn = $('emotionBtn');
  const emotionPanel = $('emotionPanel');
  const emotionCooldownBar = $('emotionCooldownBar');
  const emotionCooldownText = $('emotionCooldownText');
  const shieldInd = $('shieldInd'), shieldTime = $('shieldTime');
  const bigInd = $('bigInd'), bigTime = $('bigTime');
  const timerInd = $('timerInd');
  const bgFx = $('bgFx');

  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    const name = u.first_name || u.username || '';
    if (name) nameInput.value = name.slice(0, 12);
  }

  // ==== ВЗРЫВ НА ФОНЕ ====
  function createBgExplosion() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const count = 60; // было 90
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const spark = document.createElement('div');
      spark.className = 'bg-spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 500;
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';
      spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      spark.style.animation = `sparkFly ${0.8 + Math.random()}s cubic-bezier(0.15, 0.6, 0.4, 1) forwards`;
      spark.style.animationDelay = (Math.random() * 0.3) + 's';
      const colors = ['#ffcc44', '#ff8800', '#ff4400', '#fff', '#ff2200'];
      spark.style.background = colors[(Math.random() * colors.length) | 0];
      frag.appendChild(spark);
    }
    bgFx.appendChild(frag);
    setTimeout(() => { bgFx.innerHTML = ''; }, 2500);
    document.body.style.animation = 'shake 0.4s ease-in-out';
    setTimeout(() => { document.body.style.animation = ''; }, 400);
    haptic('explosion');
  }
  setTimeout(createBgExplosion, 300);

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    emotionBtn.classList.toggle('hidden', id !== 'gameScreen');
    if (id !== 'gameScreen') {
      emotionPanel.classList.remove('show');
    }
  }

  function canAct() {
    return (performance.now() - lastAction) / 1000 >= COOLDOWN;
  }

  function updateCD() {
    const elapsed = (performance.now() - lastAction) / 1000;
    const left = Math.max(0, COOLDOWN - elapsed);
    const progress = 1 - left / COOLDOWN;

    if (left > 0) {
      cdView.textContent = 'КД: ' + left.toFixed(1);
      cdView.classList.remove('ready');
      document.querySelectorAll('.btn').forEach(b => {
        if (b.id === 'farmBtn' || b.id === 'wallBtn' || b.id === 'shootBtn') {
          b.disabled = true;
          b.classList.add('recharging');
          const ring = b.querySelector('.cd-ring');
          const num = b.querySelector('.cd-num');
          if (ring) ring.style.background =
            `conic-gradient(rgba(0,0,0,0.7) ${progress * 360}deg, transparent ${progress * 360}deg)`;
          if (num) num.textContent = left.toFixed(1);
        }
      });
    } else {
      cdView.textContent = 'КД: 0.0';
      cdView.classList.add('ready');
      document.querySelectorAll('.btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('recharging');
        const ring = b.querySelector('.cd-ring');
        if (ring) ring.style.background = 'transparent';
      });
    }
  }
  setInterval(updateCD, 80);

  function updateBonusTimers() {
    const now = Date.now() / 1000;
    const shieldLeft = Math.max(0, myShieldUntil - now);
    const bigLeft = Math.max(0, myBigBulletsUntil - now);
    shieldInd.style.display = shieldLeft > 0 ? 'inline' : 'none';
    shieldTime.textContent = shieldLeft.toFixed(1);
    bigInd.style.display = bigLeft > 0 ? 'inline' : 'none';
    bigTime.textContent = bigLeft.toFixed(1);
  }
  setInterval(updateBonusTimers, 200);

  function updateTimer() {
    const m = Math.floor(gameElapsed / 60);
    const s = Math.floor(gameElapsed % 60);
    timerInd.textContent = `⏱ ${m}:${s.toString().padStart(2,'0')}`;
    timerInd.classList.remove('warn', 'danger');
    if (gameElapsed >= 60 && !zone.active) timerInd.classList.add('warn');
    else if (zone.active) timerInd.classList.add('danger');
  }
  setInterval(updateTimer, 300);

  function updateEmotionCooldown() {
    const now = Date.now();
    const left = Math.max(0, (emotionCooldownUntil - now) / 1000);
    if (left > 0) {
      emotionCooldownBar.classList.add('show');
      emotionCooldownText.classList.add('show');
      emotionCooldownText.textContent = Math.ceil(left);
      const deg = (1 - left / EMOTION_CD) * 360;
      emotionCooldownBar.style.background =
        `conic-gradient(#e74c3c ${deg}deg, rgba(231,76,60,0.2) ${deg}deg)`;
    } else {
      emotionCooldownBar.classList.remove('show');
      emotionCooldownText.classList.remove('show');
    }
  }
  setInterval(updateEmotionCooldown, 120);

  function showWinBanner(text) {
    winBanner.innerHTML = text;
    winBanner.classList.add('show');
    haptic('hit');
  }

  // ==== СОКЕТ ====
  function connect() {
    socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    socket.on('connect', () => { mySid = socket.id; });

    socket.on('joined', (data) => {
      roomCode = data.code;
      myColor = data.my_color;
      players = data.players;
      walls = data.walls || {};
      farms = data.farms || {};
      crates = data.crates || {};
      GUN_LEVELS = data.gun_levels || [];
      FARM_COST = data.farm_cost || 20;
      WALL_COST = data.wall_cost || 10;
      COOLDOWN = data.cooldown || 0.5;
      if (data.world_w) W = data.world_w;
      if (data.world_h) H = data.world_h;
      me = players[mySid];
      if (me) {
        myCoins = me.coins;
        myHp = me.hp;
        myKills = me.kills;
        myShieldUntil = me.shield_until || 0;
        myBigBulletsUntil = me.big_bullets_until || 0;
      }
      roomCodeEl.textContent = roomCode;
      showScreen('lobbyScreen');
      updateLobby();
    });

    socket.on('player_joined', (data) => {
      players[data.sid] = data.player;
      updateLobby();
    });

    socket.on('player_left', (data) => {
      delete players[data.sid];
      updateLobby();
      startLoop();
    });

    socket.on('ready_changed', (data) => {
      const p = players[data.sid];
      if (p) p.ready = data.ready;
      updateLobby();
    });

    socket.on('game_started', (data) => {
      players = data.players;
      walls = data.walls || {};
      farms = data.farms || {};
      crates = data.crates || {};
      if (data.world_w) W = data.world_w;
      if (data.world_h) H = data.world_h;
      me = players[mySid];
      if (me) {
        myCoins = me.coins;
        myHp = me.hp;
        myKills = me.kills;
        myShieldUntil = me.shield_until || 0;
        myBigBulletsUntil = me.big_bullets_until || 0;
      }
      gameStarted = true;
      updateHUD();
      showScreen('gameScreen');
      if (me) { cameraX = me.x - VIEW_W/2; cameraY = me.y - VIEW_H/2; }
      startLoop();
    });

    socket.on('tick_update', (data) => {
      if (data.players) {
        for (const sid in data.players) {
          const p = players[sid];
          if (p) {
            const u = data.players[sid];
            p.coins = u.coins;
            p.hp = u.hp;
            if (u.kills !== undefined) p.kills = u.kills;
            p.shield_until = u.shield_until || 0;
            p.big_bullets_until = u.big_bullets_until || 0;
          }
        }
        if (me && players[mySid]) {
          myCoins = players[mySid].coins;
          myHp = players[mySid].hp;
          myKills = players[mySid].kills;
          myShieldUntil = players[mySid].shield_until || 0;
          myBigBulletsUntil = players[mySid].big_bullets_until || 0;
          me.coins = myCoins;
          me.hp = myHp;
          me.kills = myKills;
          me.shield_until = myShieldUntil;
          me.big_bullets_until = myBigBulletsUntil;
        }
        updateHUD();
      }
      if (data.crates) {
        for (const cid in data.crates) {
          if (crates[cid]) {
            crates[cid].hp = data.crates[cid].hp;
          }
        }
      }
      if (data.zone) zone = data.zone;
      if (typeof data.elapsed === 'number') gameElapsed = data.elapsed;
    });

    socket.on('zone_warning', () => {
      zoneFlashTime = 1.0;
      haptic('explosion');
      startLoop();
    });

    socket.on('zone_update', (data) => {
      zone.left = data.left;
      zone.top = data.top;
      zone.right = data.right;
      zone.bottom = data.bottom;
      zone.active = true;
      startLoop();
    });

    socket.on('player_moved', (data) => {
      const p = players[data.sid];
      if (p) {
        p.x = data.x; p.y = data.y; p.dir = data.dir;
        startLoop();
      }
    });

    socket.on('bullet_fired', (data) => {
      const count = data.bullets || 1;
      const baseAngle = Math.atan2(data.dir.y, data.dir.x);
      const spread = 0.15;
      const isBig = !!data.big;
      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * spread;
        const a = baseAngle + offset;
        bullets.push({
          x: data.x, y: data.y,
          dx: Math.cos(a), dy: Math.sin(a),
          color: data.color, owner: data.sid,
          age: 0,
          dmg: data.dmg || 5,
          pierce: data.pierce,
          big: isBig,
          radius: isBig ? 10 : 5,
          tailLen: isBig ? 28 : 16,
          hit_targets: [],
        });
      }
      spawnMuzzleFlash(data.x + data.dir.x * 30, data.y + data.dir.y * 30, data.color, data.dir, isBig);
      startLoop();
    });

    socket.on('player_hit', (data) => {
      if (data.sid === mySid) myHp = data.hp;
      else {
        const p = players[data.sid];
        if (p) p.hp = data.hp;
      }
      const p = players[data.sid];
      if (p) {
        spawnParticles(p.x, p.y, data.zone ? '#ff2020' : '#ff4040', 8);
        spawnFlash(p.x, p.y);
      }
      haptic('hit');
      startLoop();
      updateHUD();
    });

    socket.on('player_shielded', (data) => {
      const p = players[data.sid];
      if (p) {
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 3;
          particles.push({
            x: p.x, y: p.y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, color: '#00e0ff', size: 3,
          });
        }
      }
      if (data.sid === mySid) haptic('hit');
      startLoop();
    });

    socket.on('player_died', (data) => {
      const p = players[data.sid];
      if (p) {
        p.hp = 0; p.alive = false;
        spawnParticles(p.x, p.y, data.zone ? '#ff2020' : p.color, 20);
        spawnFlash(p.x, p.y);
        startLoop();
      }
      if (data.sid === mySid) {
        setTimeout(() => {
          showScreen('menuScreen');
          winBanner.classList.remove('show');
        }, 3000);
      }
    });

    socket.on('wall_placed', (data) => {
      walls[data.id] = { x: data.x, y: data.y, hp: data.hp };
      if (data.my_coins !== undefined) myCoins = data.my_coins;
      if (me) me.coins = myCoins;
      spawnParticles(data.x, data.y, '#5a7fd8', 6);
      startLoop();
      updateHUD();
    });

    socket.on('wall_hit', (data) => {
      if (walls[data.id]) walls[data.id].hp = data.hp;
      spawnParticles(data.x, data.y, '#8fa8d8', 4);
      startLoop();
    });

    socket.on('wall_destroyed', (data) => {
      if (walls[data.id]) delete walls[data.id];
      spawnFragments(data.x, data.y, 10, '#5a7fd8');
      startLoop();
    });

    socket.on('farm_placed', (data) => {
      farms[data.id] = { x: data.x, y: data.y, hp: data.hp, last_income: 0 };
      if (data.my_coins !== undefined) myCoins = data.my_coins;
      if (me) me.coins = myCoins;
      spawnParticles(data.x, data.y, '#f1c40f', 8);
      addFloatingText(data.x, data.y - 40, '🏭', '#f1c40f', 1.5, -1.5);
      startLoop();
      updateHUD();
    });

    socket.on('farm_hit', (data) => {
      if (farms[data.id]) farms[data.id].hp = data.hp;
      spawnParticles(data.x, data.y, '#d4a017', 4);
      startLoop();
    });

    socket.on('farm_destroyed', (data) => {
      if (farms[data.id]) delete farms[data.id];
      spawnFragments(data.x, data.y, 10, '#f1c40f');
      startLoop();
    });

    socket.on('farm_income', (data) => {
      addFloatingText(data.x, data.y - 30, '+' + (data.amount || 1), '#f1c40f', 1.5, -1.2);
      if (data.owner === mySid) {
        myCoins += (data.amount || 1);
        if (me) me.coins = myCoins;
        updateHUD();
      }
      startLoop();
    });

    socket.on('crate_spawned', (data) => {
      crates[data.id] = {
        x: data.x, y: data.y,
        hp: data.hp, max_hp: data.max_hp || 3,
        bonus: data.bonus,
        spawnAnim: 1.0,
        hitFlash: 0,
      };
      spawnParticles(data.x, data.y, '#ffd700', 10);
      startLoop();
    });

    socket.on('crate_hit', (data) => {
      if (crates[data.id]) {
        crates[data.id].hp = data.hp;
        crates[data.id].hitFlash = 1.0;
      }
      spawnParticles(data.x, data.y, '#c08040', 4);
      startLoop();
    });

    socket.on('crate_destroyed', (data) => {
      if (crates[data.id]) delete crates[data.id];
      spawnFragments(data.x, data.y, 14, '#8b5a2b');
      spawnFlash(data.x, data.y);
      if (data.bonus === 'shield') {
        addFloatingText(data.x, data.y - 30, '🛡 ЩИТ!', '#00e0ff', 2, -1.0);
      } else if (data.bonus === 'big_bullets') {
        addFloatingText(data.x, data.y - 30, '🔵 БОЛЬШИЕ ПУЛИ!', '#ff8800', 2, -1.0);
      }
      if (data.player_sid === mySid) haptic('bonus');
      startLoop();
    });

    socket.on('gun_upgraded', (data) => {
      if (data.sid === mySid) {
        if (data.my_coins !== undefined) myCoins = data.my_coins;
        if (me) {
          me.gun_level = data.gun_level;
          me.coins = myCoins;
        }
        if (GUN_LEVELS[data.gun_level] && me) {
          addFloatingText(me.x, me.y - 40, GUN_LEVELS[data.gun_level].name, '#e67e22', 2, -0.8);
        }
      } else {
        const p = players[data.sid];
        if (p) p.gun_level = data.gun_level;
      }
      updateHUD();
      startLoop();
    });

    socket.on('emotion_shown', (data) => {
      if (activeEmotions.length >= MAX_EMOTIONS) activeEmotions.shift();
      activeEmotions.push({
        x: data.x,
        y: data.y - 60,
        emoji: data.emoji,
        life: EMOTION_LIFE,
        rotation: 0,
      });
      if (data.sid === mySid) haptic('emotion');
      startLoop();
    });

    socket.on('emotion_cooldown', (data) => {
      const left = data.left || 0;
      emotionCooldownUntil = Date.now() + left * 1000;
      updateEmotionCooldown();
    });

    socket.on('game_over', (data) => {
      showWinBanner('🏆 ' + data.winner + '<small>побеждает!</small>');
      setTimeout(() => {
        winBanner.classList.remove('show');
        showScreen('menuScreen');
      }, 4000);
    });

    socket.on('error_msg', (data) => {
      menuStatus.textContent = data.text;
      if (gameStarted && me) {
        addFloatingText(me.x, me.y - 40, data.text, '#e74c3c', 1.5, -0.6);
      }
    });

    socket.on('on_cooldown', () => {
      haptic('light');
      cdView.style.color = '#e74c3c';
      setTimeout(() => { cdView.style.color = ''; }, 250);
    });

    socket.on('disconnect', () => {
      menuStatus.textContent = 'Отключён';
      showScreen('menuScreen');
    });
  }

  function updateLobby() {
    lobbyPlayers.innerHTML = '';
    const list = Object.values(players);
    list.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'player-chip' + (p.ready ? ' ready' : '');
      chip.style.background = p.color;
      chip.innerHTML = `${p.name} <span class="check">${p.ready ? '✅' : '⏳'}</span>`;
      lobbyPlayers.appendChild(chip);
    });
    lobbyStatus.textContent = `Игроков: ${list.length} / 8`;

    const allReady = list.length >= 1 && (list.length === 1 || list.every(p => p.ready));
    startBtn.disabled = !allReady;
    if (!allReady) {
      const notReady = list.filter(p => !p.ready).map(p => p.name);
      if (list.length < 2) startBtn.textContent = '▶️ Начать (тест)';
      else startBtn.textContent = 'Ждём: ' + notReady.join(', ');
    } else {
      startBtn.textContent = '▶️ Начать игру';
    }

    if (players[mySid]) {
      readyBtn.textContent = players[mySid].ready ? '❌ Отменить готовность' : '✅ Я готов';
    }
  }

  function updateHUD() {
    hpView.textContent = myHp;
    if (myHp <= 30) hpWrap.classList.add('low');
    else hpWrap.classList.remove('low');
    coinsView.textContent = myCoins;
    killsView.textContent = myKills;
  }

  createBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) { menuStatus.textContent = 'Введи имя'; return; }
    if (!socket) connect();
    setTimeout(() => socket.emit('create_game', { name }), 300);
  });

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const code = codeInput.value.trim().toUpperCase();
    if (!name) { menuStatus.textContent = 'Введи имя'; return; }
    if (!code) { menuStatus.textContent = 'Введи код'; return; }
    if (!socket) connect();
    setTimeout(() => socket.emit('join_game', { name, code }), 300);
  });

  readyBtn.addEventListener('click', () => {
    if (socket) socket.emit('toggle_ready', {});
  });

  startBtn.addEventListener('click', () => {
    if (socket) socket.emit('start_game', { code: roomCode });
  });

  emotionBtn.addEventListener('click', () => {
    emotionPanel.classList.toggle('show');
    haptic('light');
  });

  emotionPanel.querySelectorAll('.emotion-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const emoji = opt.dataset.emoji;
      const now = Date.now();
      if (now < emotionCooldownUntil) {
        haptic('light');
        emotionPanel.classList.remove('show');
        return;
      }
      if (socket && gameStarted) {
        socket.emit('emotion', { emoji });
        emotionCooldownUntil = now + EMOTION_CD * 1000;
        updateEmotionCooldown();
      }
      emotionPanel.classList.remove('show');
      haptic('emotion');
    });
  });

  document.addEventListener('click', (e) => {
    if (!emotionPanel.classList.contains('show')) return;
    if (emotionPanel.contains(e.target)) return;
    if (emotionBtn.contains(e.target)) return;
    emotionPanel.classList.remove('show');
  });

  // ==== SPAWN ХЕЛПЕРЫ (с лимитами) ====
  function spawnParticles(x, y, color, count = 8) {
    if (particles.length >= MAX_PARTICLES) return;
    count = Math.min(count, MAX_PARTICLES - particles.length);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 3;
      particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, color, size: 2 + Math.random() * 2,
      });
    }
  }

  function spawnFlash(x, y) {
    if (hitFlashes.length > 30) hitFlashes.shift();
    hitFlashes.push({ x, y, life: 1, radius: 10 });
  }

  function spawnFragments(x, y, count, color) {
    if (wallFragments.length >= MAX_FRAGMENTS) return;
    count = Math.min(count, MAX_FRAGMENTS - wallFragments.length);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      wallFragments.push({
        x, y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, size: 4 + Math.random() * 5,
        rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 0.3,
        color,
      });
    }
  }

  function addFloatingText(x, y, text, color, life, vy) {
    if (floatingTexts.length >= MAX_FLOATING) floatingTexts.shift();
    floatingTexts.push({ x, y, text, color, life, vy });
  }

  function spawnMuzzleFlash(x, y, color, dir, big) {
    const count = big ? 8 : 5;
    const baseAngle = Math.atan2(dir.y, dir.x);
    for (let i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      const angle = baseAngle + (Math.random() - 0.5) * 0.8;
      const speed = 3 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.6, color,
        size: big ? 3 + Math.random() * 2 : 2 + Math.random() * 2,
      });
    }
    spawnFlash(x, y);
  }

  // ==== РЕНДЕР ====
  function drawGrid(now) {
    const startX = Math.max(0, Math.floor(cameraX / 50) * 50);
    const startY = Math.max(0, Math.floor(cameraY / 50) * 50);
    const endX = Math.min(W, cameraX + VIEW_W + 50);
    const endY = Math.min(H, cameraY + VIEW_H + 50);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cameraX, cameraY, VIEW_W, VIEW_H);

    if (zone.active) {
      const zLeft = zone.left;
      const zTop = zone.top;
      const zRight = W - zone.right;
      const zBottom = H - zone.bottom;

      ctx.fillStyle = 'rgba(231,76,60,0.35)';
      if (zTop > cameraY) ctx.fillRect(cameraX, cameraY, VIEW_W, Math.max(0, zTop - cameraY));
      if (zBottom < cameraY + VIEW_H) ctx.fillRect(cameraX, zBottom, VIEW_W, Math.max(0, cameraY + VIEW_H - zBottom));
      if (zLeft > cameraX) {
        const top = Math.max(cameraY, zTop);
        const bottom = Math.min(cameraY + VIEW_H, zBottom);
        ctx.fillRect(cameraX, top, Math.max(0, zLeft - cameraX), Math.max(0, bottom - top));
      }
      if (zRight < cameraX + VIEW_W) {
        const top = Math.max(cameraY, zTop);
        const bottom = Math.min(cameraY + VIEW_H, zBottom);
        ctx.fillRect(zRight, top, Math.max(0, cameraX + VIEW_W - zRight), Math.max(0, bottom - top));
      }

      ctx.strokeStyle = zone.warn ? 'rgba(255,100,100,0.9)' : 'rgba(231,76,60,0.9)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 6]);
      ctx.strokeRect(zLeft, zTop, zRight - zLeft, zBottom - zTop);
      ctx.setLineDash([]);
    }

    ctx.strokeStyle = '#e8e8ec';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = startX; x <= endX; x += 50) {
      ctx.moveTo(x, cameraY);
      ctx.lineTo(x, cameraY + VIEW_H);
    }
    for (let y = startY; y <= endY; y += 50) {
      ctx.moveTo(cameraX, y);
      ctx.lineTo(cameraX + VIEW_W, y);
    }
    ctx.stroke();

    if (zoneFlashTime > 0) {
      ctx.fillStyle = `rgba(255,0,0,${zoneFlashTime * 0.5})`;
      ctx.fillRect(cameraX, cameraY, VIEW_W, VIEW_H);
      zoneFlashTime -= 0.04;
      if (zoneFlashTime < 0) zoneFlashTime = 0;
    }
  }

  function drawCube(p, isMe, now) {
    if (p.alive === false) return;
    const shielded = (p.shield_until || 0) > now;

    if (p.x < cameraX - 100 || p.x > cameraX + VIEW_W + 100 ||
        p.y < cameraY - 100 || p.y > cameraY + VIEW_H + 100) return;

    const x = p.x - HALF, y = p.y - HALF;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x + 4, y + 4, CUBE, CUBE);

    const grad = ctx.createLinearGradient(x, y, x + CUBE, y + CUBE);
    grad.addColorStop(0, lighten(p.color, 20));
    grad.addColorStop(1, darken(p.color, 30));
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, CUBE, CUBE);

    ctx.strokeStyle = isMe ? '#000' : 'rgba(0,0,0,0.6)';
    ctx.lineWidth = isMe ? 3 : 2;
    ctx.strokeRect(x, y, CUBE, CUBE);

    const lvl = p.gun_level || 0;
    const barrelLen = 22 + lvl * 5;
    const barrelW = 10 + lvl * 2;
    const big = (p.big_bullets_until || 0) > now;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.dir.y, p.dir.x));
    ctx.fillStyle = darken(p.color, 50);
    ctx.fillRect(10, -barrelW / 2, barrelLen, barrelW);
    ctx.fillStyle = big ? '#ff8800' : (lvl >= 4 ? '#00e0ff' : '#222');
    ctx.fillRect(10 + barrelLen - 6, -barrelW / 2 - 1, 6, barrelW + 2);
    ctx.restore();

    if (shielded) {
      const t = now * 4;
      const pulse = 1 + Math.sin(t) * 0.08;
      const radius = (CUBE / 2 + 18) * pulse;
      const shieldGrad = ctx.createRadialGradient(p.x, p.y, radius * 0.4, p.x, p.y, radius);
      shieldGrad.addColorStop(0, 'rgba(0,224,255,0.05)');
      shieldGrad.addColorStop(0.7, 'rgba(0,180,255,0.25)');
      shieldGrad.addColorStop(1, 'rgba(0,224,255,0.6)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = shieldGrad;
      ctx.fill();
      ctx.strokeStyle = '#00e0ff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    const hpW = 54, hpH = 7;
    const curHp = isMe ? myHp : p.hp;
    const ratio = Math.max(0, (curHp || 100) / 100);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(p.x - hpW / 2 - 2, p.y - HALF - 22, hpW + 4, hpH + 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(p.x - hpW / 2, p.y - HALF - 20, hpW, hpH);
    ctx.fillStyle = ratio > 0.6 ? '#2ecc71' : (ratio > 0.3 ? '#f39c12' : '#e74c3c');
    ctx.fillRect(p.x - hpW / 2, p.y - HALF - 20, hpW * ratio, hpH);

    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeText(p.name, p.x, p.y - HALF - 26);
    ctx.fillStyle = '#000';
    ctx.fillText(p.name, p.x, p.y - HALF - 26);
  }

  function drawWalls() {
    for (const wid in walls) {
      const w = walls[wid];
      const x = w.x - WALL_SIZE / 2, y = w.y - WALL_SIZE / 2;
      if (x + WALL_SIZE < cameraX || x > cameraX + VIEW_W ||
          y + WALL_SIZE < cameraY || y > cameraY + VIEW_H) continue;

      const hpRatio = Math.max(0, w.hp / 4);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(x + 3, y + 3, WALL_SIZE, WALL_SIZE);

      const grad = ctx.createLinearGradient(x, y, x + WALL_SIZE, y + WALL_SIZE);
      grad.addColorStop(0, '#7a8fb8');
      grad.addColorStop(1, '#4a5f88');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, WALL_SIZE, WALL_SIZE);

      ctx.strokeStyle = hpRatio > 0.5 ? '#2c3e50' : (hpRatio > 0.25 ? '#f39c12' : '#e74c3c');
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, WALL_SIZE, WALL_SIZE);
    }
  }

  function drawFarms(now) {
    for (const fid in farms) {
      const f = farms[fid];
      const x = f.x, y = f.y;
      if (x < cameraX - 60 || x > cameraX + VIEW_W + 60 ||
          y < cameraY - 60 || y > cameraY + VIEW_H + 60) continue;
      const hpRatio = Math.max(0, f.hp / 8);

      const grad = ctx.createLinearGradient(x - 22, y - 22, x + 22, y + 22);
      grad.addColorStop(0, '#d4a017');
      grad.addColorStop(1, '#8a6a10');
      ctx.fillStyle = grad;
      ctx.fillRect(x - 22, y - 22, 44, 44);
      ctx.strokeStyle = hpRatio > 0.5 ? '#6a4a0a' : (hpRatio > 0.25 ? '#f39c12' : '#e74c3c');
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x - 22, y - 22, 44, 44);

      // вращающееся колесо — используем now
      ctx.save();
      ctx.translate(x, y - 30);
      ctx.rotate(now * 3);
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(-13, -3, 26, 6);
      ctx.fillRect(-3, -13, 6, 26);
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#4a2a0a';
      ctx.fill();
      ctx.restore();

      const hpW = 40, hpH = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(x - hpW/2, y - 46, hpW, hpH + 2);
      ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
      ctx.fillRect(x - hpW/2, y - 45, hpW * hpRatio, hpH);
    }
  }

  function drawCrates(now) {
    for (const cid in crates) {
      const c = crates[cid];
      if (c.hp <= 0) continue;
      const x = c.x, y = c.y;
      if (x < cameraX - 60 || x > cameraX + VIEW_W + 60 ||
          y < cameraY - 60 || y > cameraY + VIEW_H + 60) continue;
      const half = CRATE_SIZE / 2;

      let scale = 1;
      if (c.spawnAnim > 0) {
        scale = 1 + Math.sin((1 - c.spawnAnim) * Math.PI) * 0.3;
        c.spawnAnim -= 0.04;
        if (c.spawnAnim < 0) c.spawnAnim = 0;
      }

      let shakeX = 0, shakeY = 0;
      if (c.hitFlash > 0) {
        shakeX = (Math.random() - 0.5) * 4;
        shakeY = (Math.random() - 0.5) * 4;
        c.hitFlash -= 0.1;
        if (c.hitFlash < 0) c.hitFlash = 0;
      }

      ctx.save();
      ctx.translate(x + shakeX, y + shakeY);
      ctx.scale(scale, scale);

      const grad = ctx.createLinearGradient(-half, -half, half, half);
      grad.addColorStop(0, '#c08040');
      grad.addColorStop(1, '#7a4a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(-half, -half, CRATE_SIZE, CRATE_SIZE);

      ctx.strokeStyle = '#4a2a0a';
      ctx.lineWidth = 3;
      ctx.strokeRect(-half, -half, CRATE_SIZE, CRATE_SIZE);

      ctx.strokeStyle = 'rgba(60,30,10,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-half + 5, -half + 5);
      ctx.lineTo(half - 5, half - 5);
      ctx.moveTo(half - 5, -half + 5);
      ctx.lineTo(-half + 5, half - 5);
      ctx.stroke();

      ctx.globalAlpha = 0.7 + Math.sin(now * 4) * 0.3;
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (c.bonus === 'shield') {
        ctx.fillStyle = '#00e0ff';
        ctx.fillText('🛡', 0, 0);
      } else if (c.bonus === 'big_bullets') {
        ctx.fillStyle = '#ff8800';
        ctx.fillText('🔵', 0, 0);
      }
      ctx.globalAlpha = 1;

      const hpW = 44, hpH = 4;
      const hpRatio = Math.max(0, c.hp / (c.max_hp || 3));
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-hpW/2, half + 6, hpW, hpH);
      ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : (hpRatio > 0.25 ? '#f39c12' : '#e74c3c');
      ctx.fillRect(-hpW/2, half + 6, hpW * hpRatio, hpH);

      ctx.restore();
    }
  }

  function drawBullets() {
    const blen = bullets.length;
    for (let i = 0; i < blen; i++) {
      const b = bullets[i];
      const tailX = b.x - b.dx * b.tailLen;
      const tailY = b.y - b.dy * b.tailLen;
      const grad = ctx.createLinearGradient(tailX, tailY, b.x, b.y);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, b.color);
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = grad;
      ctx.lineWidth = b.big ? 10 : 5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = b.big ? '#ffaa33' : (b.pierce ? '#00e0ff' : '#fff');
      ctx.fill();
    }
  }

  function drawParticles() {
    const len = particles.length;
    for (let i = 0; i < len; i++) {
      const p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawWallFragments() {
    const len = wallFragments.length;
    for (let i = 0; i < len; i++) {
      const f = wallFragments[i];
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.fillStyle = f.color || '#5a7fd8';
      ctx.globalAlpha = f.life;
      ctx.fillRect(-f.size/2, -f.size/2, f.size, f.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatingTexts() {
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    for (let i = 0; i < floatingTexts.length; i++) {
      const t = floatingTexts[i];
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 4;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.globalAlpha = Math.min(1, t.life);
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawFlashes() {
    for (let i = 0; i < hitFlashes.length; i++) {
      const f = hitFlashes[i];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.globalAlpha = f.life;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawEmotions() {
    for (let i = 0; i < activeEmotions.length; i++) {
      const e = activeEmotions[i];
      const progress = e.life / EMOTION_LIFE;
      let scale;
      if (progress > 0.8) scale = (1 - progress) / 0.2 * 1.3;
      else if (progress > 0.2) scale = 1.3;
      else scale = progress / 0.2 * 1.3;
      const yOffset = -60 * (1 - progress) * 0.5;
      ctx.save();
      ctx.translate(e.x, e.y + yOffset);
      ctx.rotate(e.rotation);
      ctx.scale(scale, scale);
      ctx.font = '44px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.min(1, progress * 1.5);
      ctx.fillText(e.emoji, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawMinimap() {
    const size = 100;
    const pad = 8;
    const mx = canvas.width - size - pad;
    const my = pad;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(mx, my, size, size);
    ctx.strokeStyle = '#5a7fd8';
    ctx.lineWidth = 2;
    ctx.strokeRect(mx, my, size, size);

    const sx = size / W;
    const sy = size / H;

    if (zone.active) {
      ctx.fillStyle = 'rgba(231,76,60,0.35)';
      const zx = mx + zone.left * sx;
      const zy = my + zone.top * sy;
      const zw = (W - zone.left - zone.right) * sx;
      const zh = (H - zone.top - zone.bottom) * sy;
      ctx.fillRect(mx, my, size, zy - my);
      ctx.fillRect(mx, zy + zh, size, my + size - zy - zh);
      ctx.fillRect(mx, zy, zx - mx, zh);
      ctx.fillRect(zx + zw, zy, mx + size - zx - zw, zh);
    }

    for (const sid in players) {
      const p = players[sid];
      if (p.alive === false) continue;
      const px = mx + p.x * sx;
      const py = my + p.y * sy;
      ctx.beginPath();
      ctx.arc(px, py, sid === mySid ? 3.5 : 2.5, 0, Math.PI*2);
      ctx.fillStyle = sid === mySid ? '#fff' : p.color;
      ctx.fill();
    }
  }

  function render(now) {
    if (me) {
      const targetCamX = me.x - VIEW_W / 2;
      const targetCamY = me.y - VIEW_H / 2;
      cameraX += (targetCamX - cameraX) * 0.15;
      cameraY += (targetCamY - cameraY) * 0.15;
      cameraX = Math.max(0, Math.min(W - VIEW_W, cameraX));
      cameraY = Math.max(0, Math.min(H - VIEW_H, cameraY));
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scaleX = canvas.width / VIEW_W;
    const scaleY = canvas.height / VIEW_H;
    ctx.setTransform(scaleX, 0, 0, scaleY, -cameraX * scaleX, -cameraY * scaleY);

    drawGrid(now);
    drawFarms(now);
    drawWalls();
    drawCrates(now);
    for (const sid in players) {
      if (sid === mySid) continue;
      drawCube(players[sid], false, now);
    }
    if (me) drawCube(me, true, now);
    drawBullets();
    drawParticles();
    drawWallFragments();
    drawFlashes();
    drawFloatingTexts();
    drawEmotions();

    // миникарта — раз в 3 кадра
    minimapCounter++;
    if (minimapCounter >= 3) {
      minimapCounter = 0;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawMinimap();
    }
  }

  function lighten(color, percent) {
    const num = parseInt(color.replace('#',''), 16);
    const r = Math.min(255, (num >> 16) + percent);
    const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
    const b = Math.min(255, (num & 0x0000FF) + percent);
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }
  function darken(color, percent) { return lighten(color, -percent); }

  function move(dir) {
    if (moving || !me || myHp <= 0 || !canAct() || !gameStarted) {
      if (!canAct()) haptic('light');
      return;
    }
    haptic('light');
    lastAction = performance.now();
    updateCD();
    moving = true;
    const dirs = {
      up:    { x: 0, y: -1 }, down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 }, right: { x: 1, y: 0 },
    };
    const d = dirs[dir];
    me.dir = d;
    const tx = Math.max(HALF, Math.min(W - HALF, me.x + d.x * STEP));
    const ty = Math.max(HALF, Math.min(H - HALF, me.y + d.y * STEP));
    const sx = me.x, sy = me.y;
    const dx = tx - sx, dy = ty - sy;
    let i = 0;
    function step() {
      i++;
      if (i > ANIM) {
        me.x = tx; me.y = ty;
        moving = false;
        socket.emit('move', { x: me.x, y: me.y, dir: me.dir });
        startLoop();
        return;
      }
      const t = i / ANIM;
      me.x = sx + dx * t; me.y = sy + dy * t;
      requestAnimationFrame(step);
    }
    step();
  }

  document.querySelectorAll('.btn').forEach(btn => {
    if (btn.dataset.dir) btn.addEventListener('click', () => move(btn.dataset.dir));
  });

  $('shootBtn').addEventListener('click', () => {
    if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; }
    haptic('shot');
    lastAction = performance.now();
    updateCD();
    socket.emit('shoot', {});
  });

  $('wallBtn').addEventListener('click', () => {
    if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; }
    haptic('light');
    lastAction = performance.now();
    updateCD();
    socket.emit('place_wall', {});
  });

  $('farmBtn').addEventListener('click', () => {
    if (!me || myHp <= 0 || !canAct() || !gameStarted) { haptic('light'); return; }
    haptic('light');
    lastAction = performance.now();
    updateCD();
    socket.emit('place_farm', {});
  });

  $('gunBtn').addEventListener('click', () => {
    if (!me || myHp <= 0 || !gameStarted) return;
    haptic('light');
    socket.emit('upgrade_gun', {});
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') move('up');
    else if (e.key === 'ArrowDown') move('down');
    else if (e.key === 'ArrowLeft') move('left');
    else if (e.key === 'ArrowRight') move('right');
    else if (e.key === ' ') { e.preventDefault(); $('shootBtn').click(); }
    else if (e.key === 'e' || e.key === 'E') { $('wallBtn').click(); }
    else if (e.key === 'q' || e.key === 'Q') { $('farmBtn').click(); }
    else if (e.key === 'f' || e.key === 'F') { emotionBtn.click(); }
  });

  // ==== ОБНОВЛЕНИЕ СУЩНОСТЕЙ (без рендера) ====
  function updateEntities() {
    // пули
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.dx * BULLET_STEP;
      b.y += b.dy * BULLET_STEP;
      b.age += 0.03;

      // хвост — реже
      if (particles.length < MAX_PARTICLES && Math.random() < 0.35) {
        particles.push({
          x: b.x, y: b.y,
          vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
          life: b.big ? 0.7 : 0.4,
          color: b.big ? '#ffaa33' : b.color,
          size: b.big ? 2.5 : 1.5,
        });
      }

      let hitSomething = false;

      for (const wid in walls) {
        const w = walls[wid];
        const dxw = w.x - b.x, dyw = w.y - b.y;
        if (dxw*dxw + dyw*dyw > 2500) continue;
        socket.emit('hit_wall', { wall_id: wid });
        spawnParticles(b.x, b.y, '#8fa8d8', 5);
        if (!b.pierce) hitSomething = true;
        break;
      }

      if (!hitSomething) {
        for (const fid in farms) {
          const f = farms[fid];
          const dxf = f.x - b.x, dyf = f.y - b.y;
          if (dxf*dxf + dyf*dyf > 3600) continue;
          socket.emit('hit_farm', { farm_id: fid });
          spawnParticles(b.x, b.y, '#d4a017', 5);
          if (!b.pierce) hitSomething = true;
          break;
        }
      }

      if (!hitSomething) {
        for (const cid in crates) {
          const c = crates[cid];
          if (c.hp <= 0) continue;
          const dxc = c.x - b.x, dyc = c.y - b.y;
          if (dxc*dxc + dyc*dyc > 2500) continue;
          socket.emit('hit_crate', { crate_id: cid });
          spawnParticles(b.x, b.y, '#c08040', 6);
          if (!b.pierce) hitSomething = true;
          break;
        }
      }

      if (!hitSomething) {
        for (const sid in players) {
          if (sid === b.owner) continue;
          if (b.hit_targets && b.hit_targets.includes(sid)) continue;
          const p = players[sid];
          if (p.alive === false) continue;
          const dxp = p.x - b.x, dyp = p.y - b.y;
          if (dxp*dxp + dyp*dyp < (HALF + b.radius) * (HALF + b.radius)) {
            socket.emit('hit', { target_sid: sid, dmg: b.dmg, killer: b.owner });
            if (!b.hit_targets) b.hit_targets = [];
            b.hit_targets.push(sid);
            spawnParticles(b.x, b.y, '#ff4040', 6);
            if (!b.pierce) hitSomething = true;
            break;
          }
        }
      }

      if (hitSomething || b.age >= BULLET_LIFE || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
        for (let k = 0; k < 4; k++) {
          if (particles.length >= MAX_PARTICLES) break;
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 2;
          particles.push({
            x: b.x, y: b.y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 0.5, color: b.big ? '#ffaa33' : b.color,
            size: b.big ? 3 : 1.5,
          });
        }
        bullets.splice(i, 1);
      }
    }

    // частицы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= 0.04;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // фрагменты
    for (let i = wallFragments.length - 1; i >= 0; i--) {
      const f = wallFragments[i];
      f.x += f.vx; f.y += f.vy;
      f.vx *= 0.94; f.vy *= 0.94;
      f.vy += 0.3;
      f.life -= 0.025;
      f.rot += f.vrot;
      if (f.life <= 0) wallFragments.splice(i, 1);
    }

    // тексты
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y += t.vy;
      t.life -= 0.02;
      if (t.life <= 0) floatingTexts.splice(i, 1);
    }

    // вспышки
    for (let i = hitFlashes.length - 1; i >= 0; i--) {
      const f = hitFlashes[i];
      f.life -= 0.08; f.radius += 4;
      if (f.life <= 0) hitFlashes.splice(i, 1);
    }

    // эмоции
    for (let i = activeEmotions.length - 1; i >= 0; i--) {
      const e = activeEmotions[i];
      e.rotation += 0.08;
      e.life -= 0.02;
      if (e.life <= 0) activeEmotions.splice(i, 1);
    }
  }

  // ==== ЦИКЛ ====
  function startLoop() {
    if (loopRunning) return;
    loopRunning = true;
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (now - lastFrame < FRAME_INTERVAL) {
      requestAnimationFrame(loop);
      return;
    }
    lastFrame = now;

    updateEntities();
    render(now / 1000);

    // продолжаем, только если есть что рендерить или идёт игра
    if (gameStarted && (bullets.length > 0 || particles.length > 0 ||
        wallFragments.length > 0 || floatingTexts.length > 0 ||
        hitFlashes.length > 0 || activeEmotions.length > 0 ||
        moving || zoneFlashTime > 0 || Object.keys(crates).length > 0)) {
      requestAnimationFrame(loop);
    } else {
      loopRunning = false;
      render(now / 1000);
    }
  }

  // запускаем цикл при старте игры
  const _origGameStart = () => { startLoop(); };

  // стартовый кадр меню (без цикла)
  startLoop();
</script>
